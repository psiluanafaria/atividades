<title>Vista o Armário</title>
<style>

@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700&display=swap');
:root{
  --paper:#fffaf2;
  --ink:#4a3420;
  --accent:#d9853c;
  --accent-dark:#8a4d1d;
  --pink:#e8789e;
}
*{box-sizing:border-box;}
body{font-family:'Nunito',sans-serif;color:var(--ink);}
h1,h2,.title-font{font-family:'Baloo 2',cursive;}

html,body{background:#f3ead9;}
body{margin:0;padding:0;}
.app{
  max-width:900px;margin:0 auto;padding:20px 16px 40px;
}
header{text-align:center;margin-bottom:14px;}
header h1{font-size:clamp(20px,4vw,30px);color:var(--accent-dark);margin:0 0 8px 0;}
header p{font-size:clamp(13px,2.4vw,15px);color:#5c4128;max-width:560px;margin:0 auto;line-height:1.5;}

.stage{
  display:flex;justify-content:center;margin:18px 0 22px;
}
.wardrobe-holder{
  position:relative;width:min(92vw,460px);
}
.wardrobe-holder .wardrobe-svg{width:100%;height:auto;display:block;position:relative;z-index:1;}
.wardrobe-holder .door-overlay-svg{
  position:absolute;left:0;top:0;width:100%;height:100%;z-index:4;pointer-events:none;display:block;
}

.dropzone{
  position:absolute;border-radius:10px;z-index:2;
  outline:2.5px dashed rgba(138,77,29,0);
  transition:outline-color .15s, background-color .15s;
}
.dropzone.hover{outline-color:#d9853c; background-color:rgba(217,133,60,0.18);}
.dropzone.filled{outline:none;}
.dropzone.wrong-flash{outline-color:#d64545; background-color:rgba(214,69,69,0.18);}

.placed-chip{position:absolute;pointer-events:none;z-index:2;}
.placed-chip img{width:100%;height:100%;display:block;filter:drop-shadow(0 2px 3px rgba(0,0,0,.25));}

@keyframes doorBounce{0%{transform:scale(1);}45%{transform:scale(1.035);}100%{transform:scale(1);}}
.wardrobe-holder.bounce{animation:doorBounce .45s ease;}

.tray{
  display:flex;flex-wrap:wrap;justify-content:center;gap:14px;
  background:#fffaf2;border:2px dashed #e0c9a6;border-radius:16px;
  padding:18px 14px;min-height:120px;
}
.chip{
  width:82px;height:82px;display:flex;align-items:center;justify-content:center;
  cursor:grab;touch-action:none;user-select:none;
  background:#fff;border-radius:12px;box-shadow:0 2px 6px rgba(0,0,0,.12);
  padding:6px;
}
.chip img{max-width:100%;max-height:100%;pointer-events:none;}
.chip.dragging{
  position:fixed;z-index:1000;cursor:grabbing;
  background:transparent;box-shadow:none;padding:0;border-radius:0;
}
.chip.dragging img{
  filter:
    drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff)
    drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff)
    drop-shadow(1.4px 1.4px 0 #fff) drop-shadow(-1.4px 1.4px 0 #fff)
    drop-shadow(1.4px -1.4px 0 #fff) drop-shadow(-1.4px -1.4px 0 #fff)
    drop-shadow(0 5px 10px rgba(0,0,0,.35));
}
.chip.placed{visibility:hidden;}

.controls{display:flex;justify-content:center;gap:12px;margin-top:20px;flex-wrap:wrap;}
button{
  font-family:'Baloo 2',cursive;font-size:15px;padding:10px 22px;border-radius:999px;
  border:none;cursor:pointer;background:var(--accent);color:#fff;box-shadow:0 3px 0 var(--accent-dark);
}
button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--accent-dark);}
button.secondary{background:#fff;color:var(--accent-dark);border:2px solid var(--accent-dark);box-shadow:none;}

#successMsg{
  text-align:center;font-family:'Baloo 2',cursive;font-size:20px;color:#2f8f4e;
  margin-top:16px;padding:12px;border-radius:12px;background:#e9f8ee;border:2px solid #bfe8cd;
}
#successMsg[hidden]{display:none;}

@media (max-width:480px){
  .chip{width:68px;height:68px;}
}
</style>

(function(){
  var ZONES = {"jacket": {"leftPct": 17.25792714884696, "topPct": 14.907407407407408, "widthPct": 15.48414570230608, "heightPct": 15.092592592592593}, "tshirt": {"leftPct": 34.57154088050315, "topPct": 14.907407407407408, "widthPct": 14.819182389937104, "heightPct": 13.425925925925927}, "dress": {"leftPct": 52.244289970208534, "topPct": 14.907407407407408, "widthPct": 13.435948361469713, "heightPct": 16.296296296296298}, "jeans": {"leftPct": 70.22458916615946, "topPct": 14.907407407407408, "widthPct": 11.43761412051126, "heightPct": 16.11111111111111}, "sneakers": {"leftPct": 18.478522681653956, "topPct": 64.07407407407408, "widthPct": 12.099558410276996, "heightPct": 8.148148148148149}, "socks": {"leftPct": 36.32412398921833, "topPct": 62.22222222222222, "widthPct": 10.370619946091644, "heightPct": 10.0}, "beanie": {"leftPct": 53.611706689536874, "topPct": 60.83333333333333, "widthPct": 9.75771869639794, "heightPct": 11.38888888888889}, "mittens": {"leftPct": 69.6123499142367, "topPct": 61.85185185185185, "widthPct": 11.718696397941681, "heightPct": 10.37037037037037}};
  var holder = document.getElementById('wardrobeHolder');
  var tray = document.getElementById('tray');
  var successMsg = document.getElementById('successMsg');
  var placedCount = 0;
  var totalZones = Object.keys(ZONES).length;

  // build invisible dropzone overlays positioned over each shadow
  var zoneEls = {};
  Object.keys(ZONES).forEach(function(name){
    var z = ZONES[name];
    var el = document.createElement('div');
    el.className = 'dropzone';
    el.style.left = z.leftPct + '%';
    el.style.top = z.topPct + '%';
    el.style.width = z.widthPct + '%';
    el.style.height = z.heightPct + '%';
    el.dataset.item = name;
    holder.appendChild(el);
    zoneEls[name] = el;
  });

  // ---- door close/open animation (points-morph from open trapezoid to a flush closed
  // rectangle), performed on a separate overlay SVG stacked above the drag-and-drop layer ----
  var doorLeft = document.getElementById('doorLeft');
  var doorRight = document.getElementById('doorRight');
  var closedDetails = document.getElementById('closedDetails');

  function parsePoints(str){
    return str.trim().split(' ').map(function(pair){
      return pair.split(',').map(Number);
    });
  }
  function pointsToString(pts){
    return pts.map(function(p){ return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' ');
  }
  function easeInOutCubic(t){ return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2; }

  function animateDoors(toClosed, duration, onDone){
    if (!doorLeft || !doorRight) return;
    var leftOpen = parsePoints(doorLeft.dataset.open), leftClosed = parsePoints(doorLeft.dataset.closed);
    var rightOpen = parsePoints(doorRight.dataset.open), rightClosed = parsePoints(doorRight.dataset.closed);
    var fromL = toClosed ? leftOpen : leftClosed, toL = toClosed ? leftClosed : leftOpen;
    var fromR = toClosed ? rightOpen : rightClosed, toR = toClosed ? rightClosed : rightOpen;
    var start = null;
    function step(ts){
      if (!start) start = ts;
      var t = Math.min(1, (ts - start) / duration);
      var te = easeInOutCubic(t);
      doorLeft.setAttribute('points', pointsToString(fromL.map(function(p,i){
        return [p[0]+(toL[i][0]-p[0])*te, p[1]+(toL[i][1]-p[1])*te];
      })));
      doorRight.setAttribute('points', pointsToString(fromR.map(function(p,i){
        return [p[0]+(toR[i][0]-p[0])*te, p[1]+(toR[i][1]-p[1])*te];
      })));
      if (t < 1){ requestAnimationFrame(step); }
      else if (onDone) onDone();
    }
    requestAnimationFrame(step);
  }

  function closeWardrobe(){
    animateDoors(true, 900, function(){
      if (closedDetails){
        closedDetails.style.transition = 'opacity .35s ease';
        closedDetails.style.opacity = 1;
      }
      holder.classList.add('bounce');
      setTimeout(function(){ holder.classList.remove('bounce'); }, 450);
    });
  }

  function resetWardrobeDoors(){
    if (doorLeft) doorLeft.setAttribute('points', doorLeft.dataset.open);
    if (doorRight) doorRight.setAttribute('points', doorRight.dataset.open);
    if (closedDetails){
      closedDetails.style.transition = 'none';
      closedDetails.style.opacity = 0;
    }
  }

  var dragEl = null;
  var dragItem = null;
  var startX = 0, startY = 0, origLeft = 0, origTop = 0;
  var homeParent = null, homeNext = null;

  function pointFromEvent(e){
    return {x: e.clientX, y: e.clientY};
  }

  function onPointerDown(e){
    var chip = e.currentTarget;
    if (chip.classList.contains('placed')) return;
    dragEl = chip;
    dragItem = chip.dataset.item;
    homeParent = chip.parentNode;
    homeNext = chip.nextSibling;
    var rect = chip.getBoundingClientRect();
    origLeft = rect.left; origTop = rect.top;
    var p = pointFromEvent(e);
    startX = p.x; startY = p.y;

    document.body.appendChild(chip);
    chip.style.width = rect.width + 'px';
    chip.style.height = rect.height + 'px';
    chip.style.left = rect.left + 'px';
    chip.style.top = rect.top + 'px';
    chip.classList.add('dragging');
    chip.setPointerCapture && chip.setPointerCapture(e.pointerId);

    window.addEventListener('pointermove', onPointerMove);
    window.addEventListener('pointerup', onPointerUp);
  }

  function currentHoverZone(clientX, clientY){
    var best = null;
    Object.keys(zoneEls).forEach(function(name){
      var el = zoneEls[name];
      if (el.classList.contains('filled')) return;
      var r = el.getBoundingClientRect();
      if (clientX >= r.left && clientX <= r.right && clientY >= r.top && clientY <= r.bottom){
        best = name;
      }
    });
    return best;
  }

  function onPointerMove(e){
    if (!dragEl) return;
    var p = pointFromEvent(e);
    var dx = p.x - startX, dy = p.y - startY;
    dragEl.style.left = (origLeft + dx) + 'px';
    dragEl.style.top = (origTop + dy) + 'px';

    Object.values(zoneEls).forEach(function(el){ el.classList.remove('hover'); });
    var cx = origLeft + dx + dragEl.offsetWidth/2;
    var cy = origTop + dy + dragEl.offsetHeight/2;
    var hz = currentHoverZone(cx, cy);
    if (hz) zoneEls[hz].classList.add('hover');
  }

  function returnHome(){
    dragEl.classList.remove('dragging');
    dragEl.style.position = '';
    dragEl.style.left = '';
    dragEl.style.top = '';
    dragEl.style.width = '';
    dragEl.style.height = '';
    homeParent.insertBefore(dragEl, homeNext);
  }

  function onPointerUp(e){
    window.removeEventListener('pointermove', onPointerMove);
    window.removeEventListener('pointerup', onPointerUp);
    if (!dragEl) return;

    var cx = dragEl.getBoundingClientRect().left + dragEl.offsetWidth/2;
    var cy = dragEl.getBoundingClientRect().top + dragEl.offsetHeight/2;
    var hz = currentHoverZone(cx, cy);
    Object.values(zoneEls).forEach(function(el){ el.classList.remove('hover'); });

    if (hz && hz === dragItem){
      // correct placement: snap into the wardrobe over the shadow
      var z = ZONES[hz];
      var img = dragEl.querySelector('img').cloneNode(true);
      var placed = document.createElement('div');
      placed.className = 'placed-chip';
      placed.style.left = z.leftPct + '%';
      placed.style.top = z.topPct + '%';
      placed.style.width = z.widthPct + '%';
      placed.style.height = z.heightPct + '%';
      placed.appendChild(img);
      holder.appendChild(placed);
      zoneEls[hz].classList.add('filled');

      dragEl.classList.remove('dragging');
      dragEl.style.position = '';
      dragEl.style.left = ''; dragEl.style.top = '';
      dragEl.style.width = ''; dragEl.style.height = '';
      homeParent.insertBefore(dragEl, homeNext);
      dragEl.classList.add('placed');

      placedCount++;
      if (placedCount === totalZones){
        successMsg.hidden = false;
        setTimeout(closeWardrobe, 700);
      }
    } else if (hz && hz !== dragItem){
      zoneEls[hz].classList.add('wrong-flash');
      setTimeout(function(){ zoneEls[hz].classList.remove('wrong-flash'); }, 400);
      returnHome();
    } else {
      returnHome();
    }

    dragEl = null; dragItem = null;
  }

  document.querySelectorAll('.chip').forEach(function(chip){
    chip.addEventListener('pointerdown', onPointerDown);
  });

  document.getElementById('resetBtn').addEventListener('click', function(){
    document.querySelectorAll('.placed-chip').forEach(function(el){ el.remove(); });
    Object.values(zoneEls).forEach(function(el){ el.classList.remove('filled','hover','wrong-flash'); });
    document.querySelectorAll('.chip.placed').forEach(function(el){ el.classList.remove('placed'); });
    successMsg.hidden = true;
    placedCount = 0;
    resetWardrobeDoors();
  });
})();
</script>

</body></html>
